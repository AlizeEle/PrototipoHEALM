<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HEALM Prototipo</title>

<style>
/* Layout: una sola columna tipo celular, botones grandes, una acción por pantalla.
   Color: cada pilar conserva su color en todas las pantallas para reconocerlo sin leer. */
:root{
  --bg:#EAF2F0; --surface:#FFFFFF; --ink:#10302D; --muted:#4A6662; --line:#CFE0DC;
  --teal:#0B7A75; --orange:#C65A0A; --red:#C63B36; --blue:#2A60BD; --sun:#F2B52B; --sun-ink:#3A2A00;
  --soft:#DCEBE8; --ok:#1F7A45; --bad:#B3342F;
  --font-display:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --font-body:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A19; --surface:#162827; --ink:#E6F1EF; --muted:#9DB8B3; --line:#274240;
    --soft:#1D3533; --sun:#F2B52B; --ok:#58C98A; --bad:#FF8A84; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1A19; --surface:#162827; --ink:#E6F1EF; --muted:#9DB8B3; --line:#274240;
  --soft:#1D3533; --sun:#F2B52B; --ok:#58C98A; --bad:#FF8A84; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;min-height:100dvh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 28px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.1;text-wrap:balance}

.net{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;color:var(--ink)}
.net svg{flex:none}
.net .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.net span{min-width:0}

.top{display:flex;align-items:center;gap:12px}
.back{width:52px;height:52px;border-radius:16px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;flex:none}
.top .crumb{font-family:var(--font-display);font-weight:700;font-size:20px;min-width:0}

.hero{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.logo{font-family:var(--font-display);font-weight:800;font-size:64px;letter-spacing:.02em;color:var(--teal);line-height:1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{color:#35C7BF}}
:root[data-theme="dark"] .logo{color:#35C7BF}
.hero p{margin:0;font-size:20px;color:var(--muted);font-weight:600}
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:20px;background:var(--sun);color:var(--sun-ink);font-family:var(--font-display);font-weight:800;font-size:24px;padding:12px 20px;text-align:center;width:100%}
.big:active{transform:scale(.98)}
.facts{display:grid;gap:10px;margin:6px 0 0;padding:0;list-style:none}
.facts li{display:flex;gap:12px;align-items:center;font-weight:700;font-size:17px}
.facts i{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}

.greet{font-size:30px}
.sub{margin:0;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{aspect-ratio:1/1;border-radius:24px;color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.tile:active{transform:scale(.97)}
.tile svg{width:52px;height:52px}
.tile b{font-family:var(--font-display);font-size:23px;line-height:1.05;font-weight:700}
.tile small{display:block;font-family:var(--font-body);font-weight:700;font-size:13.5px;opacity:.92;margin-top:4px;line-height:1.2}
.c-neg{background:var(--teal)} .c-her{background:var(--orange)} .c-sal{background:var(--red)} .c-dec{background:var(--blue)}

.banner{border-radius:24px;color:#fff;padding:18px;display:flex;gap:14px;align-items:center}
.banner svg{width:48px;height:48px;flex:none}
.banner h2{font-size:28px}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;min-height:76px;width:100%}
.row:active{transform:scale(.985)}
.row .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.row .ic svg{width:28px;height:28px}
.row b{font-family:var(--font-display);font-size:21px;line-height:1.1;display:block}
.row small{display:block;color:var(--muted);font-weight:600;font-size:15px;margin-top:2px}
.row .go{margin-left:auto;flex:none;color:var(--muted)}
.row>div{min-width:0}

.lead{font-size:21px;font-weight:700;margin:0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.steps .n{width:38px;height:38px;border-radius:50%;color:#fff;font-family:var(--font-display);font-weight:800;font-size:20px;display:grid;place-items:center;flex:none}
.steps .t{min-width:0;font-weight:600;font-size:19px}
.steps .t b{font-weight:800}
.bullets li{align-items:center}
.bullets .n{width:14px;height:14px;margin-top:6px;border-radius:50%}
.tip{border-radius:20px;background:var(--soft);padding:14px 16px;font-weight:700;font-size:17px}
.tip em{font-style:normal;font-family:var(--font-display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;display:block;color:var(--muted);margin-bottom:2px}
.help{border-radius:20px;border:2px dashed var(--bad);padding:12px 16px;font-weight:800;font-size:17px;color:var(--ink)}

.ask h3{font-size:24px;margin-bottom:10px}
.opts{display:grid;gap:10px}
.opt{min-height:60px;border-radius:18px;border:2px solid var(--line);background:var(--surface);padding:12px 16px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:12px}
.opt .ck{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);flex:none}
.opt[aria-pressed="true"]{border-color:var(--ok);background:var(--soft)}
.opt[aria-pressed="true"] .ck{border-color:var(--ok);background:var(--ok)}
.thanks{background:var(--soft);border-radius:20px;padding:14px 16px;font-weight:800}
.ghost{min-height:56px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-weight:800;text-align:center;padding:10px 16px;width:100%;display:block}

.foot{margin-top:auto;display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);font-weight:700;padding-top:8px}
.foot button{text-decoration:underline;font-weight:800;color:var(--muted);padding:6px 0}

/* panel de prueba */
.panel h2{font-size:28px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:grid;gap:10px}
.card h3{font-size:20px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;font-size:16px;min-height:46px;background:var(--surface);text-align:center}
.seg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums;min-width:380px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--font-display);font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.crit{display:grid;gap:8px}
.crit div{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:700;font-size:16px}
.pill{border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.pill.y{background:var(--ok);color:#fff} .pill.n{background:var(--bad);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.y,:root:not([data-theme="light"]) .pill.n{color:#0D1A19}}
:root[data-theme="dark"] .pill.y,:root[data-theme="dark"] .pill.n{color:#0D1A19}
.pill.na{background:var(--soft);color:var(--muted)}
.small{font-size:14px;color:var(--muted);font-weight:600;margin:0}
textarea{width:100%;min-height:90px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;padding:8px}

/* Ajuste a cualquier pantalla */
.tile b{overflow-wrap:anywhere;hyphens:auto}
@media (max-width:360px){
  body{font-size:17px}
  .logo{font-size:52px}
  .greet,.tile b{font-size:19px}
  .greet{font-size:26px}
  .banner h2{font-size:22px}
  .tile{padding:12px}
  .tile svg{width:42px;height:42px}
  .big{font-size:21px}
}
@media (min-width:520px){ .wrap{zoom:1.2} }
@media (min-width:900px){
  .wrap{zoom:1.45;padding-block:32px}
  body{background:linear-gradient(180deg,var(--bg),var(--soft))}
}
@media (min-width:520px) and (max-height:700px){ .wrap{zoom:1} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.big:active,.tile:active,.row:active{transform:none}}

/* ---- Compañero diario ---- */
:root{--link:#0B6B67;--on-bad:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--link:#35C7BF;--on-bad:#0D1A19}}
:root[data-theme="dark"]{--link:#35C7BF;--on-bad:#0D1A19}

.hhero{background:linear-gradient(155deg,#0B7A75,#0A4F5C);color:#fff;border-radius:28px;padding:18px 18px 22px;display:grid;gap:8px}
.hhero .row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.06em}
.live{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:800;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:999px}
.live i{width:8px;height:8px;border-radius:50%;background:#7CF0A6}
.hhero h1{font-size:34px;margin-top:6px}
.hhero p{margin:0;font-weight:700;opacity:.95;font-size:18px}
.sec{font-size:22px}
.mood{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mood button{border:2px solid var(--line);border-radius:18px;padding:12px 6px;display:grid;justify-items:center;gap:6px;font-weight:800;font-size:16px;background:var(--surface);text-align:center;min-height:92px}
.mood svg{width:40px;height:40px}
.moodmsg{margin:0;font-weight:700}
.askcard{display:flex;gap:14px;align-items:center;background:var(--sun);color:var(--sun-ink);border-radius:24px;padding:16px 18px;width:100%}
.askcard svg{width:46px;height:46px;flex:none}
.askcard b{font-family:var(--font-display);font-size:24px;display:block;line-height:1.1}
.askcard small{display:block;font-weight:700;font-size:15px;margin-top:3px}
.askcard:active{transform:scale(.985)}
.tipday{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px 18px}
.tipday .ic{width:48px;height:48px;border-radius:16px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;flex:none}
.tipday em{font-style:normal;font-family:var(--font-display);font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block}
.tipday p{margin:2px 0 6px;font-weight:700;font-size:19px}
.tipday>div{min-width:0}
.link{font-weight:800;color:var(--link);text-decoration:underline;padding:4px 0}
.sos{border:2px solid var(--bad);border-radius:24px;padding:16px 18px;display:grid;gap:10px;background:var(--surface)}
.sos h3{font-size:21px}
.call{display:flex;align-items:center;gap:12px;min-height:56px;border-radius:16px;background:var(--bad);color:var(--on-bad);font-weight:800;padding:10px 14px;text-decoration:none;font-size:17px}
.call svg{width:24px;height:24px;flex:none}
.call b{font-family:var(--font-display);font-size:21px;margin-left:auto}
.nav{position:sticky;bottom:max(8px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.14);margin-top:8px;z-index:5}
.nav button{display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:18px;font-weight:800;font-size:14px;text-align:center;color:var(--muted)}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{background:var(--teal);color:#fff}
.foot{margin-top:auto}
.nav+.foot{margin-top:0}

.chathead{display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;flex:none}
.msgs{display:flex;flex-direction:column;gap:12px;flex:1}
.m{display:flex;gap:10px;align-items:flex-end;max-width:100%}
.m.u{justify-content:flex-end}
.m .b{border-radius:20px;padding:12px 16px;font-weight:600;font-size:18px;max-width:88%;min-width:0;overflow-wrap:anywhere}
.m.bot .b{background:var(--surface);border:2px solid var(--line);border-bottom-left-radius:6px}
.m.u .b{background:var(--teal);color:#fff;border-bottom-right-radius:6px}
.m .b p{margin:0 0 8px}
.m .b p:last-child{margin:0}
.m .b ul{margin:6px 0 10px;padding-left:20px;display:grid;gap:6px}
.open{display:block;margin-top:10px;background:var(--sun);color:var(--sun-ink);border-radius:14px;padding:12px 14px;font-weight:800;text-align:center;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--teal);color:var(--link);border-radius:999px;padding:10px 16px;font-weight:800;font-size:16px;background:var(--surface);min-height:46px;text-align:center}
.composer{position:sticky;bottom:max(8px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding:6px 0;z-index:5}
.composer input{flex:1;min-width:0;height:60px;border-radius:20px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 16px;font:inherit;font-weight:600;font-size:18px}
.composer input:focus-visible,.namein:focus-visible{outline:3px solid var(--sun)}
.send{width:60px;height:60px;border-radius:20px;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none}
.send svg{width:28px;height:28px}
.namein{width:100%;height:58px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 16px;font:inherit;font-weight:700;font-size:19px}
label.lb{font-weight:800;font-size:16px;color:var(--muted);display:block;margin-bottom:6px}
.save[aria-pressed="true"]{border-color:var(--ok);background:var(--soft)}
.seg button[aria-pressed="false"]{color:var(--ink)}
@media (max-width:360px){ .hhero h1{font-size:28px} .askcard b{font-size:21px} }

.facts i svg{width:22px;height:22px}
.tile b{hyphens:manual}
@media (max-width:430px){ .tile b{font-size:20px} }
.call b{white-space:nowrap;font-size:19px}
.call span{min-width:0}
</style>

<script>

    {id:'neg-3', t:'Dónde vender cerca de ti', d:'Tianguis, pedidos y vecinos', lead:'Tus primeros clientes están a pocas calles.', kind:'bullets', steps:[
      'Tianguis o mercado de tu comunidad',
      'Pedidos con tus vecinos y familiares',
      'Tiendita de la esquina: deja tu producto a consignación',
      'Escuela o taller: pregunta si puedes ofrecer ahí',
      'Un letrero sencillo con tu nombre y cómo contactarte'],
      tip:'Un cliente satisfecho que te recomienda vale más que un anuncio.'}

function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim(); }
function reply(q){
  var n = ' '+norm(q), best=null, bs=0;
  KB.forEach(function(e){
    var s=0; e.keys.forEach(function(k){ if(n.indexOf(' '+k)>-1) s += k.length>5?2:1; });
    if(e.prio && s>0) s+=100;
    if(s>bs){ bs=s; best=e; }
  });
  if(!best) return null;
  if(best.topic){
    var f=findTopic(best.topic), t=f.t;
    var items=t.steps.slice(0,3).map(function(x){return '<li>'+x+'</li>'}).join('');
    return {html:'<p><b>'+esc(t.lead)+'</b></p><ul>'+items+'</ul>', topic:best.topic, k:f.k};
  }
  var op = best.open ? findTopic(best.open) : null;
  return {html:best.html, topic:best.open||null, k:op?op.k:null};
}

  var box=document.getElementById('msgs'); if(!box) return;

function setChips(mode){
  var c=document.getElementById('chips'); if(!c) return;
  if(mode==='fallback'){
    c.innerHTML = ['neg-1','sal-1','dec-1'].map(function(id){var f=findTopic(id);
      return '<button class="chip" data-act="topic" data-k="'+f.k+'" data-id="'+id+'">'+esc(f.t.t)+'</button>'}).join('');
  } else {
    c.innerHTML = SUGGEST.filter(function(s){return !asked[s]}).slice(0,4).map(function(s){
      return '<button class="chip" data-act="chip" data-q="'+esc(s)+'">'+esc(s)+'</button>'}).join('');
  }
}
function ask(text){
  text=(text||'').trim(); if(!text) return;
  asked[text]=1;
  var u={role:'u',text:text}; CHAT.push(u); addMsg(u);
  var r=reply(text);
  rec('pregunta',{q:text.slice(0,200), ok:!!r, topic:(r&&r.topic)||null});
  setTimeout(function(){
    var m;
    if(r){ m={role:'b',html:r.html+(r.topic?'<button class="open" data-act="topic" data-k="'+r.k+'" data-id="'+r.topic+'">Abrir la guía completa</button>':'')}; }
    else { m={role:'b',html:'<p>Todavía no tengo una respuesta guardada para eso.</p><p>Tu pregunta quedó anotada para que HEALM mejore. Mientras tanto, mira estas guías:</p>'}; }
    CHAT.push(m);
    if(cur && cur.screen==='chat'){ addMsg(m); setChips(r?null:'fallback'); }
  }, 350);
}

  if(cur && !back){ stack.push({screen:cur.screen,id:cur.id,pillar:cur.pillar}); }

    } else {
      h += '<p class="moodmsg">Gracias por contarlo. No tienes que cargar con todo tú solo o sola.</p>'+
           '<div class="seg"><button data-act="nav" data-to="chat" aria-pressed="false">Hablar con HEALM</button><button data-act="topic" data-k="sal" data-id="sal-3" aria-pressed="false">Guía de bienestar</button></div>';
    }
    h += '</div>';
    h += '<button class="askcard" data-act="nav" data-to="chat">'+ICONS.chat+'<span><b>Pregúntale a HEALM</b><small>Escribe tu duda. Responde aunque no haya internet.</small></span></button>';
    h += '<div class="tipday"><span class="ic">'+ICONS.bulb.replace('<svg','<svg width="28" height="28"')+'</span><div><em>Consejo de hoy</em><p>'+esc(tip.t)+'</p>'+
         (tip.id?'<button class="link" data-act="topic" data-k="'+findTopic(tip.id).k+'" data-id="'+tip.id+'">Ver la guía</button>':'')+'</div></div>';
    h += '<h2 class="sec">¿Qué quieres aprender?</h2>';
    h += '<div class="tiles">'+ORDER.map(function(k){var p=PILLARS[k];
      return '<button class="tile '+p.cls+'" data-act="pillar" data-k="'+k+'">'+ICONS[k]+'<span><b>'+esc(p.name)+'</b><small>'+esc(p.hint)+'</small></span></button>'}).join('')+'</div>';
    if(LAST && findTopic(LAST.id)){ h += '<h2 class="sec">Seguir donde me quedé</h2>'+topicRow(findTopic(LAST.id)); }
    h += '<div class="sos"><h3>¿Necesitas ayuda ahora?</h3>'+
         '<a class="call" href="tel:911">'+ICONS.call+'Emergencias<b>911</b></a>'+
         '<a class="call" href="tel:8009112000">'+ICONS.call+'Línea de la Vida<b>800 911 2000</b></a>'+
         '<p class="small">Gratis. La Línea de la Vida atiende a cualquier hora.</p></div>';
    h += '<div class="foot"><span>Prototipo de prueba</span><button data-act="panel">Modo prueba</button></div>';
    h += navBar('home');
  }
  else if(s==='chat'){
    if(!CHAT.length){ CHAT.push({role:'b',html:'<p><b>'+hello()+(NAME?', '+esc(NAME):'')+'. Soy el asistente de HEALM.</b></p><p>Cuéntame qué necesitas. Respondo con guías guardadas, por eso funciono sin internet.</p>'}); }
    h += '<div class="chathead"><button class="back" data-act="back" aria-label="Regresar">'+ICONS.back+'</button><span class="av">H</span><div><b style="font-family:var(--font-display);font-size:22px;display:block;line-height:1">HEALM</b><span class="small">Asistente sin internet</span></div></div>';
    h += '<div class="msgs" id="msgs">'+CHAT.map(msgHTML).join('')+'</div>';
    h += '<div class="chips" id="chips"></div>';
    h += '<form class="composer" id="cform" autocomplete="off"><input id="q" maxlength="200" placeholder="Escribe tu duda aquí" aria-label="Tu pregunta"><button class="send" type="submit" aria-label="Enviar">'+ICONS.send+'</button></form>';
    h += '<p class="small" style="margin:0">Tus preguntas se guardan solo en este celular.</p>';
  }
  else if(s==='saved'){
    h += topBar('Inicio');
    h += '<h2 style="font-size:30px">Mis guías guardadas</h2>';
    var list = SAVED.map(findTopic).filter(Boolean);
    h += list.length ? '<div class="list">'+list.map(topicRow).join('')+'</div>'
                     : '<div class="card"><p style="margin:0;font-weight:700">Todavía no guardas ninguna. Abre una guía y toca «Guardar esta guía» para tenerla aquí.</p></div>';
    h += navBar('saved');
  }
  else if(s==='pillar'){
    var p = PILLARS[cur.id];
    h += topBar('Inicio');
    h += '<div class="banner '+p.cls+'">'+ICONS[cur.id]+'<h2>'+esc(p.name)+'</h2></div>';
    h += '<div class="list">'+p.topics.map(function(t){ return topicRow({t:t,k:cur.id}); }).join('')+'</div>';
    h += navBar('home');
  }
  else if(s==='topic'){
    var pp = PILLARS[cur.pillar], t = findTopic(cur.id).t, isSaved = SAVED.indexOf(t.id)>-1;
    h += topBar(pp.name);
    h += '<h2 style="font-size:30px">'+esc(t.t)+'</h2>';
    h += '<p class="lead">'+esc(t.lead)+'</p>';
    h += '<ol class="steps '+(t.kind==='bullets'?'bullets':'')+'">'+t.steps.map(function(x,i){
      return '<li><span class="n" style="background:'+pp.color+'">'+(t.kind==='bullets'?'':(i+1))+'</span><span class="t">'+x+'</span></li>'}).join('')+'</ol>';
    h += '<div class="tip"><em>Recuerda</em>'+esc(t.tip)+'</div>';
    if(t.help) h += '<div class="help">'+esc(t.help)+'</div>';
    h += '<div class="ask"><h3>¿Qué harás con esto?</h3><div class="opts" id="opts">'+INTENTS.map(function(o){
      return '<button class="opt" data-act="intent" data-v="'+o.v+'" aria-pressed="false"><span class="ck"></span>'+esc(o.t)+'</button>'}).join('')+'</div><div id="thanks"></div></div>';
    h += '<button class="ghost save" data-act="save" data-id="'+t.id+'" aria-pressed="'+isSaved+'"><span>'+(isSaved?'Guía guardada':'Guardar esta guía')+'</span></button>';
    h += '<button class="ghost" data-act="nav" data-to="chat">Tengo una duda, preguntar a HEALM</button>';
    h += '<button class="ghost" data-act="back">Ver otra guía</button>';
    h += navBar('home');
  }
  else if(s==='panel'){ h += panelHTML(); }
  app.innerHTML = h;
  if(s==='chat'){ setChips(null); }
}

/* ---------- Panel de prueba ---------- */
function pids(){ var set = {}; LOG.forEach(function(e){set[e.pid]=1}); set[PID]=1; return Object.keys(set).sort(); }
function stats(pid){
  var ev = LOG.filter(function(e){return e.pid===pid});
  var views = ev.filter(function(e){return e.type==='view' && e.screen==='topic'});
  var topics = {}; views.forEach(function(v){topics[v.id]=1});
  var ms = views.reduce(function(a,v){return a+(v.ms||0)},0);
  var days = {}; ev.filter(function(e){return e.type==='enter'}).forEach(function(e){days[new Date(e.ts).toDateString()]=1});
  var intents = ev.filter(function(e){return e.type==='intent'}).map(function(e){return e.v});
  var ay = ev.filter(function(e){return e.type==='ayuda'}); var solo = ay.length ? ay[ay.length-1].v : null;
  var concrete = intents.some(function(v){return v==='probar'||v==='contar'});
  var qs = ev.filter(function(e){return e.type==='pregunta'}).length;
  return {pid:pid, solo:solo, topics:Object.keys(topics).length, ms:ms, days:Object.keys(days).length, intents:intents, concrete:concrete, qs:qs};
}
function pill(ok){ return ok===null?'<span class="pill na">sin dato</span>':(ok?'<span class="pill y">Sí</span>':'<span class="pill n">No</span>'); }
function fmt(ms){var s=Math.round(ms/1000);return s<60?s+' s':Math.floor(s/60)+' min '+(s%60)+' s'}
function ratio(n,d){return d? (n+' de '+d+' ('+Math.round(100*n/d)+'%)') : 'sin participantes'}
function panelHTML(){
  var ids = pids(), all = ids.map(stats), N = all.length;
  var entranSolo = all.filter(function(x){return x.solo==='si'}).length;
  var obs = all.filter(function(x){return x.solo!==null}).length;
  var segunda = all.filter(function(x){return x.topics>=2}).length;
  var volvio = all.filter(function(x){return x.days>=2}).length;
  var accion = all.filter(function(x){return x.concrete}).length;
  var preg = all.filter(function(x){return x.qs>=1}).length;
  var mine = stats(PID);
  var qlist = LOG.filter(function(e){return e.type==='pregunta'}).slice(-25).reverse();
  var h = '<div class="panel" style="display:grid;gap:16px">';
  h += topBar('Volver al prototipo');
  h += '<h2>Modo prueba</h2><p class="small">Los datos se guardan solo en este celular. Para juntar varios dispositivos, copia el registro de cada uno.</p>';
  h += '<div class="card"><h3>Participante actual: '+esc(PID)+'</h3><div class="seg" id="pids">'+ids.map(function(i){return '<button data-act="setpid" data-id="'+i+'" aria-pressed="'+(i===PID)+'">'+i+'</button>'}).join('')+'<button data-act="newpid" aria-pressed="false">+ Nuevo</button></div>'+
    '<h3 style="margin-top:6px">¿Entró sin ayuda?</h3><div class="seg"><button data-act="ayuda" data-v="si" aria-pressed="'+(mine.solo==='si')+'">Sí, solo</button><button data-act="ayuda" data-v="no" aria-pressed="'+(mine.solo==='no')+'">Necesitó ayuda</button></div>'+
    '<p class="small">Marca esto observando, sin ayudar antes de que lo intente.</p></div>';
  h += '<div class="card"><h3>Criterios de la suposición</h3><div class="crit">'+
    '<div><span>Entran solos ≥ 60%<br><small class="small">'+ratio(entranSolo,obs)+'</small></span>'+pill(obs?entranSolo/obs>=0.6:null)+'</div>'+
    '<div><span>Abren una 2.ª guía ≥ 50%<br><small class="small">'+ratio(segunda,N)+'</small></span>'+pill(N?segunda/N>=0.5:null)+'</div>'+
    '<div><span>Regresan otro día ≥ 30%<br><small class="small">'+ratio(volvio,N)+'</small></span>'+pill(N?volvio/N>=0.3:null)+'</div>'+
    '<div><span>Dicen una acción concreta<br><small class="small">'+ratio(accion,N)+'</small></span>'+pill(N?accion/N>=0.5:null)+'</div>'+
    '<div><span>Hacen una pregunta al asistente<br><small class="small">'+ratio(preg,N)+'</small></span>'+pill(N?preg/N>=0.3:null)+'</div>'+
    '</div></div>';
  h += '<div class="card"><h3>Por participante</h3><div class="tablewrap"><table><thead><tr><th>ID</th><th>Solo</th><th>Guías</th><th>Tiempo</th><th>Días</th><th>Preg.</th><th>Intención</th></tr></thead><tbody>'+
    all.map(function(x){return '<tr><td>'+esc(x.pid)+'</td><td>'+(x.solo==='si'?'Sí':x.solo==='no'?'No':'–')+'</td><td>'+x.topics+'</td><td>'+fmt(x.ms)+'</td><td>'+x.days+'</td><td>'+x.qs+'</td><td>'+(x.intents.length?esc(x.intents[x.intents.length-1]):'–')+'</td></tr>'}).join('')+
    '</tbody></table></div></div>';
  h += '<div class="card"><h3>Preguntas al asistente</h3><p class="small">Las marcadas con ✗ no tuvieron respuesta: son temas que faltan en HEALM.</p>'+
    (qlist.length? '<div class="tablewrap"><table><tbody>'+qlist.map(function(e){return '<tr><td>'+esc(e.pid)+'</td><td>'+(e.ok?'✓':'✗')+'</td><td style="white-space:normal">'+esc(e.q)+'</td></tr>'}).join('')+'</tbody></table></div>' : '<p class="small">Aún no hay preguntas.</p>')+'</div>';
  h += '<div class="card"><h3>Registro</h3><div class="seg"><button data-act="copy">Copiar registro</button><button data-act="reset" id="reset">Borrar todo</button></div><textarea id="out" readonly hidden></textarea><p class="small" id="msg"></p></div>';
  h += '</div>';
  return h;
}

/* ---------- Eventos ---------- */
var resetArmed = false;
app.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]'); if(!b) return;
  var a = b.getAttribute('data-act');
  if(a==='enter'){
    var nm=document.getElementById('nm'); if(nm){ NAME=nm.value.trim().slice(0,20); save('healm_name',NAME); }
    rec('enter'); go('home');
  }
  else if(a==='pillar'){ go('pillar', b.getAttribute('data-k')); }
  else if(a==='topic'){ go('topic', b.getAttribute('data-id'), b.getAttribute('data-k')); }
  else if(a==='back'){ goBack(); }
  else if(a==='panel'){ go('panel'); }
  else if(a==='nav'){ var to=b.getAttribute('data-to'); if(cur.screen!==to){ go(to); stack=[]; } }
  else if(a==='mood'){ MOOD={d:today(),v:b.getAttribute('data-v')}; save('healm_mood',MOOD); rec('animo',{v:MOOD.v}); render(); }
  else if(a==='chip'){ ask(b.getAttribute('data-q')); }
  else if(a==='save'){
    var id=b.getAttribute('data-id'), i=SAVED.indexOf(id);
    if(i>-1) SAVED.splice(i,1); else SAVED.push(id);
    save('healm_saved',SAVED); rec('guardar',{id:id,on:i===-1});
    b.setAttribute('aria-pressed', String(i===-1));
    b.querySelector('span').textContent = i===-1 ? 'Guía guardada' : 'Guardar esta guía';
  }
  else if(a==='intent'){
    var v = b.getAttribute('data-v'); intentChosen = v;
    rec('intent',{v:v, topic:cur.id});
    var all = app.querySelectorAll('.opt'); for(var k=0;k<all.length;k++){ all[k].setAttribute('aria-pressed', all[k]===b?'true':'false'); }
    document.getElementById('thanks').innerHTML = '<div class="thanks" style="margin-top:10px">Gracias. Puedes elegir otra guía.</div>';
  }
  else if(a==='setpid'){ PID=b.getAttribute('data-id'); save('healm_pid',PID); render(); }
  else if(a==='newpid'){
    var n=1, ex=pids(); while(ex.indexOf('P'+(n<10?'0'+n:n))>-1) n++;
    PID='P'+(n<10?'0'+n:n); save('healm_pid',PID); render();
  }
  else if(a==='ayuda'){ rec('ayuda',{v:b.getAttribute('data-v')}); render(); }
  else if(a==='copy'){
    var out = document.getElementById('out'), msg = document.getElementById('msg');
    var text = JSON.stringify(LOG);
    out.value = text; out.hidden = false; out.focus(); out.select();
    var done = function(){ msg.textContent='Registro copiado.'; };
    try{ navigator.clipboard.writeText(text).then(done,function(){ msg.textContent='Selecciona el texto y cópialo.'; }); }
    catch(e){ msg.textContent='Selecciona el texto y cópialo.'; }
  }
  else if(a==='reset'){
    if(!resetArmed){ resetArmed=true; b.textContent='Toca otra vez para borrar'; return; }
    resetArmed=false; LOG=[]; save('healm_log',LOG); PID='P01'; save('healm_pid',PID); render();
  }
});
app.addEventListener('submit', function(ev){
  if(ev.target.id==='cform'){ ev.preventDefault(); var i=document.getElementById('q'); var v=i.value; i.value=''; ask(v); }
});

go('welcome');

</script>
